services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: ./apps/api
    ports: ["4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: causal_analytics
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    depends_on: [mongo]
volumes:
  mongo_data:
